name: Build BadCBA PKG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev
  PS3DEV_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz
  APP_VERSION: "01.00"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential wget ca-certificates python3 zip \
          libelf1 zlib1g libgmp10 libssl3

    - name: Cache PS3DEV toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/ps3dev
        key: ps3dev-linux-X64-nightly-2026-07-26-ubuntu24

    - name: Download & install prebuilt PS3DEV
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -e
        wget -q -O /tmp/ps3dev.tar.gz "${{ env.PS3DEV_URL }}"
        sudo mkdir -p ${{ env.PS3DEV }}
        sudo tar -xzf /tmp/ps3dev.tar.gz -C /usr/local
        if [ -d /usr/local/ps3dev/ps3dev ]; then
          sudo mv /usr/local/ps3dev/ps3dev/* /usr/local/ps3dev/ || true
        fi
        if [ ! -x ${{ env.PS3DEV }}/ppu/bin/ppu-gcc ]; then
          FOUND=$(find /usr/local -name 'ppu-gcc' -type f 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            ROOT=$(dirname $(dirname $(dirname "$FOUND")))
            sudo rm -rf ${{ env.PS3DEV }}
            sudo mv "$ROOT" ${{ env.PS3DEV }}
          fi
        fi
        sudo chown -R $USER:$USER ${{ env.PS3DEV }}
        rm -f /tmp/ps3dev.tar.gz

    - name: Setup PATH
      run: |
        echo "${{ env.PS3DEV }}/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/ppu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/spu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/host/bin" >> $GITHUB_PATH
        echo "PS3DEV=${{ env.PS3DEV }}" >> $GITHUB_ENV
        echo "PSL1GHT=${{ env.PSL1GHT }}" >> $GITHUB_ENV

    - name: Verify toolchain
      run: |
        which ppu-gcc && ppu-gcc --version | head -2
        which pkg.py || which pkg || echo "pkg.py missing – folder install only"
        which fself || which make_self_npdrm || echo "fself missing"

    - name: Sync version.dat
      run: |
        echo "${{ env.APP_VERSION }}" > version.dat
        mkdir -p data && cp version.dat data/version.dat

    - name: Generate icons
      run: python3 tools/gen_icons.py

    - name: Build BadCBA
      run: |
        set -e
        make clean || true
        make -j$(nproc)
        make folder-install
        # Real PKG only with toolchain pkg.py (fake PKG causes 80029564)
        make pkg || echo "PKG skipped – use BCBA00001 folder install"
        # Zip folder for easy USB copy
        zip -r BCBA00001_folder.zip BCBA00001
        ls -la BCBA00001_folder.zip BadCBA.pkg BadCBA.elf BadCBA.self 2>/dev/null || ls -la

    - name: Collect release files
      id: files
      run: |
        mkdir -p release_out
        for f in BadCBA.pkg BadCBA.elf BadCBA.self version.dat BCBA00001_folder.zip; do
          [ -f "$f" ] && cp "$f" release_out/ && echo "+ $f" || echo "- $f"
        done
        echo "count=$(ls release_out | wc -l)" >> $GITHUB_OUTPUT
        ls -la release_out/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BadCBA-${{ github.sha }}
        path: release_out/*
        if-no-files-found: warn

    - name: Publish Release
      if: github.event_name != 'pull_request' && steps.files.outputs.count != '0'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && format('BadCBA {0}', github.ref_name) || format('BadCBA latest ({0})', env.APP_VERSION) }}
        body: |
          ## BadCBA – BadCustomBootAnimation (PS3)

          ### If PKG gives error **80029564**
          Use **folder install** instead:

          1. Download `BCBA00001_folder.zip` and extract
          2. Copy `BCBA00001/` to USB
          3. multiMAN / IrisMAN → copy to `/dev_hdd0/game/BCBA00001/`
          4. Reboot / refresh XMB → launch under Game

          See [INSTALL.md](INSTALL.md)
        files: release_out/*
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        make_latest: true
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
