name: Build BadCBA PKG

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev
  PS3DEV_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz
  APP_VERSION: "01.00"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential wget ca-certificates python3 \
          libelf1 zlib1g libgmp10 libssl3
        ldd --version | head -1

    - name: Cache PS3DEV toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/ps3dev
        key: ps3dev-linux-X64-nightly-2026-07-26-ubuntu24

    - name: Download & install prebuilt PS3DEV
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -e
        echo "Downloading prebuilt toolchain..."
        wget -q --show-progress -O /tmp/ps3dev.tar.gz "${{ env.PS3DEV_URL }}"
        echo "Extracting to ${{ env.PS3DEV }} ..."
        sudo mkdir -p ${{ env.PS3DEV }}
        sudo tar -xzf /tmp/ps3dev.tar.gz -C /usr/local
        if [ -d /usr/local/ps3dev/ps3dev ]; then
          sudo mv /usr/local/ps3dev/ps3dev/* /usr/local/ps3dev/ || true
        fi
        if [ ! -x ${{ env.PS3DEV }}/ppu/bin/ppu-gcc ]; then
          FOUND=$(find /usr/local -name 'ppu-gcc' -type f 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            ROOT=$(dirname $(dirname $(dirname "$FOUND")))
            echo "Found toolchain at $ROOT"
            sudo rm -rf ${{ env.PS3DEV }}
            sudo mv "$ROOT" ${{ env.PS3DEV }}
          fi
        fi
        sudo chown -R $USER:$USER ${{ env.PS3DEV }}
        rm -f /tmp/ps3dev.tar.gz
        ls -la ${{ env.PS3DEV }}/ppu/bin/ | head -20 || ls -la ${{ env.PS3DEV }}/ | head -30

    - name: Setup PATH
      run: |
        echo "${{ env.PS3DEV }}/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/ppu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/spu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/host/bin" >> $GITHUB_PATH
        echo "PS3DEV=${{ env.PS3DEV }}" >> $GITHUB_ENV
        echo "PSL1GHT=${{ env.PSL1GHT }}" >> $GITHUB_ENV

    - name: Verify toolchain
      run: |
        which ppu-gcc || { echo "ppu-gcc missing"; exit 1; }
        ppu-gcc --version | head -3

    - name: Sync version.dat
      run: |
        # Keep version.dat in sync (root + data for PKG)
        echo "${{ env.APP_VERSION }}" > version.dat
        mkdir -p data
        cp version.dat data/version.dat
        cat version.dat

    - name: Generate icons
      run: |
        python3 tools/gen_icons.py
        ls -la data/

    - name: Build BadCBA
      run: |
        set -e
        make clean || true
        make -j$(nproc)
        make pkg || echo "PKG tools optional – ELF/SELF still built"
        ls -la *.elf *.self *.pkg version.dat data/version.dat 2>/dev/null || ls -la

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BadCBA-${{ github.sha }}
        path: |
          BadCBA.pkg
          BadCBA.elf
          BadCBA.self
          version.dat
          data/ICON0.PNG
          data/PIC1.PNG
          data/version.dat
        if-no-files-found: warn

    # Create GitHub Release when a version tag is pushed (v1.0.0, v01.00, ...)
    - name: Create Release from tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: BadCBA ${{ github.ref_name }}
        body: |
          **BadCBA** – PS3 Custom Boot Maker (MP4)

          Version: `${{ env.APP_VERSION }}`
          Tag: `${{ github.ref_name }}`

          ### Install
          1. Copy `BadCBA.pkg` to USB
          2. Package Manager → Install Package Files
          3. Launch from XMB under Game

          ### Files
          - `BadCBA.pkg` – installable package
          - `version.dat` – `${{ env.APP_VERSION }}`
        files: |
          BadCBA.pkg
          BadCBA.elf
          BadCBA.self
          version.dat
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Also upload when a Release is published via GitHub UI
    - name: Upload to existing Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          BadCBA.pkg
          BadCBA.elf
          BadCBA.self
          version.dat
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
