name: Build BadCBA PKG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev
  PS3DEV_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz
  APP_VERSION: "01.00"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential wget ca-certificates python3 zip file \
          libelf1 zlib1g libgmp10 libssl3

    - name: Cache PS3DEV toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/ps3dev
        key: ps3dev-linux-X64-nightly-2026-07-26-ubuntu24

    - name: Download & install prebuilt PS3DEV
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -e
        wget -q -O /tmp/ps3dev.tar.gz "${{ env.PS3DEV_URL }}"
        sudo mkdir -p ${{ env.PS3DEV }}
        sudo tar -xzf /tmp/ps3dev.tar.gz -C /usr/local
        if [ -d /usr/local/ps3dev/ps3dev ]; then
          sudo mv /usr/local/ps3dev/ps3dev/* /usr/local/ps3dev/ || true
        fi
        if [ ! -x ${{ env.PS3DEV }}/ppu/bin/ppu-gcc ]; then
          FOUND=$(find /usr/local -name 'ppu-gcc' -type f 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            ROOT=$(dirname $(dirname $(dirname "$FOUND")))
            sudo rm -rf ${{ env.PS3DEV }}
            sudo mv "$ROOT" ${{ env.PS3DEV }}
          fi
        fi
        sudo chown -R $USER:$USER ${{ env.PS3DEV }}
        rm -f /tmp/ps3dev.tar.gz

    - name: Setup PATH
      run: |
        echo "${{ env.PS3DEV }}/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/ppu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/spu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/host/bin" >> $GITHUB_PATH
        echo "PS3DEV=${{ env.PS3DEV }}" >> $GITHUB_ENV
        echo "PSL1GHT=${{ env.PSL1GHT }}" >> $GITHUB_ENV

    - name: Verify toolchain
      run: |
        which ppu-gcc && ppu-gcc --version | head -2
        if ! which fself >/dev/null 2>&1 && ! which make_self_npdrm >/dev/null 2>&1; then
          echo "ERROR: fself / make_self_npdrm missing – cannot make runnable EBOOT"
          find ${{ env.PS3DEV }} -name 'fself*' 2>/dev/null | head
          exit 1
        fi
        which fself || which make_self_npdrm

    - name: Sync version.dat
      run: |
        echo "${{ env.APP_VERSION }}" > version.dat
        mkdir -p data && cp version.dat data/version.dat

    - name: Generate icons
      run: python3 tools/gen_icons.py

    - name: Build BadCBA
      run: |
        set -e
        make clean || true
        make -j$(nproc)
        make folder-install
        # Verify EBOOT is not raw ELF (would cause 80029533)
        python3 -c "d=open('BCBA00001/USRDIR/EBOOT.BIN','rb').read(4); assert d!=b'\\x7fELF', 'EBOOT is still ELF'; print('EBOOT magic OK:', d.hex())"
        make pkg || echo "PKG optional – folder zip is enough"
        zip -r BCBA00001_folder.zip BCBA00001
        ls -la BCBA00001_folder.zip BadCBA.self 2>/dev/null || true

    - name: Collect release files
      id: files
      run: |
        mkdir -p release_out
        for f in BadCBA.pkg BadCBA.elf BadCBA.self version.dat BCBA00001_folder.zip; do
          [ -f "$f" ] && cp "$f" release_out/ && echo "+ $f" || echo "- $f"
        done
        echo "count=$(ls release_out | wc -l)" >> $GITHUB_OUTPUT

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BadCBA-${{ github.sha }}
        path: release_out/*
        if-no-files-found: warn

    - name: Publish Release
      if: github.event_name != 'pull_request' && steps.files.outputs.count != '0'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && format('BadCBA {0}', github.ref_name) || format('BadCBA latest ({0})', env.APP_VERSION) }}
        body: |
          ## BadCBA

          **Install:** use `BCBA00001_folder.zip` → copy to `/dev_hdd0/game/BCBA00001/`

          - 80029564 = bad PKG → use folder zip
          - 80029533 = bad EBOOT (fixed: fself -n required)
        files: release_out/*
        fail_on_unmatched_files: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
