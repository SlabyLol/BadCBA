name: Build BadCBA PKG

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release after build'
        required: false
        default: 'false'
        type: boolean
      version:
        description: 'Version tag (e.g. v1.0.0) – only if create_release'
        required: false
        default: 'v1.0.0'

# Required so GITHUB_TOKEN can create/update releases
permissions:
  contents: write
  actions: read

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev
  PS3DEV_URL: https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz
  APP_VERSION: "01.00"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential wget ca-certificates python3 \
          libelf1 zlib1g libgmp10 libssl3

    - name: Cache PS3DEV toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/ps3dev
        key: ps3dev-linux-X64-nightly-2026-07-26-ubuntu24

    - name: Download & install prebuilt PS3DEV
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -e
        wget -q --show-progress -O /tmp/ps3dev.tar.gz "${{ env.PS3DEV_URL }}"
        sudo mkdir -p ${{ env.PS3DEV }}
        sudo tar -xzf /tmp/ps3dev.tar.gz -C /usr/local
        if [ -d /usr/local/ps3dev/ps3dev ]; then
          sudo mv /usr/local/ps3dev/ps3dev/* /usr/local/ps3dev/ || true
        fi
        if [ ! -x ${{ env.PS3DEV }}/ppu/bin/ppu-gcc ]; then
          FOUND=$(find /usr/local -name 'ppu-gcc' -type f 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            ROOT=$(dirname $(dirname $(dirname "$FOUND")))
            sudo rm -rf ${{ env.PS3DEV }}
            sudo mv "$ROOT" ${{ env.PS3DEV }}
          fi
        fi
        sudo chown -R $USER:$USER ${{ env.PS3DEV }}
        rm -f /tmp/ps3dev.tar.gz

    - name: Setup PATH
      run: |
        echo "${{ env.PS3DEV }}/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/ppu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/spu/bin" >> $GITHUB_PATH
        echo "${{ env.PS3DEV }}/host/bin" >> $GITHUB_PATH
        echo "PS3DEV=${{ env.PS3DEV }}" >> $GITHUB_ENV
        echo "PSL1GHT=${{ env.PSL1GHT }}" >> $GITHUB_ENV

    - name: Verify toolchain
      run: |
        which ppu-gcc || { echo "ppu-gcc missing"; exit 1; }
        ppu-gcc --version | head -3

    - name: Sync version.dat
      run: |
        echo "${{ env.APP_VERSION }}" > version.dat
        mkdir -p data
        cp version.dat data/version.dat
        echo "version.dat = $(cat version.dat)"

    - name: Generate icons
      run: python3 tools/gen_icons.py

    - name: Build BadCBA
      run: |
        set -e
        make clean || true
        make -j$(nproc)
        make pkg || echo "PKG optional"
        echo "=== Build outputs ==="
        ls -la BadCBA.elf BadCBA.self BadCBA.pkg version.dat 2>/dev/null || ls -la

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BadCBA-${{ github.sha }}
        path: |
          BadCBA.pkg
          BadCBA.elf
          BadCBA.self
          version.dat
          data/ICON0.PNG
          data/PIC1.PNG
        if-no-files-found: warn

    # ---- RELEASE ----
    # Runs when: tag v* pushed, OR release published, OR manual workflow_dispatch with create_release
    - name: Publish GitHub Release
      id: release
      if: |
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version) || github.ref_name }}
        name: BadCBA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || env.APP_VERSION }}
        body: |
          ## BadCBA – PS3 Custom Boot Maker (MP4)

          | | |
          |---|---|
          | Version | `${{ env.APP_VERSION }}` |
          | Commit | `${{ github.sha }}` |

          ### Install
          1. Copy **BadCBA.pkg** to a FAT32 USB
          2. PS3 → Package Manager → Install Package Files
          3. Launch **BadCBA** under Game in the XMB

          ### Included
          - `BadCBA.pkg` – installable package
          - `BadCBA.elf` / `BadCBA.self` – raw binaries
          - `version.dat` – `${{ env.APP_VERSION }}`
        files: |
          BadCBA.pkg
          BadCBA.elf
          BadCBA.self
          version.dat
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release status
      if: always()
      run: |
        echo "Event: ${{ github.event_name }}"
        echo "Ref:   ${{ github.ref }}"
        echo "Release step ran when tag v*, release event, or manual create_release."
        if [ "${{ steps.release.outcome }}" = "success" ]; then
          echo "Release published successfully."
        elif [ "${{ steps.release.outcome }}" = "skipped" ]; then
          echo "Release skipped (expected on normal main pushes)."
          echo "To publish: git tag v1.0.0 && git push origin v1.0.0"
          echo "Or: Actions → Run workflow → enable create_release"
        else
          echo "Release outcome: ${{ steps.release.outcome }}"
        fi
