name: Build BadCBA PKG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use a container that already has (or can build) the PS3 toolchain.
    # Official prebuilt images are large; we bootstrap ps3dev when needed.

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential autoconf automake bison flex \
          libelf-dev libgmp-dev libncurses5-dev libssl-dev \
          libtool-bin pkg-config texinfo wget zlib1g-dev \
          git python3 python3-pip cmake ca-certificates \
          libpng-dev

    - name: Cache PS3DEV toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: /usr/local/ps3dev
        key: ps3dev-toolchain-ubuntu22-${{ hashFiles('.github/workflows/build.yml') }}

    - name: Build / restore PS3 toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -e
        export PS3DEV=/usr/local/ps3dev
        export PSL1GHT=$PS3DEV
        sudo mkdir -p $PS3DEV
        sudo chown -R $USER:$USER $PS3DEV

        echo "=== Cloning ps3toolchain ==="
        git clone --depth=1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
        cd /tmp/ps3toolchain

        # toolchain.sh builds everything (takes a long time on first run)
        # We run it with a reasonable timeout / continue on partial success for CI visibility
        echo "=== Building toolchain (this can take 30-90 min on first run) ==="
        ./toolchain.sh || echo "Toolchain build finished with warnings"

        echo "=== Checking ppu-gcc ==="
        export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH
        which ppu-gcc || echo "ppu-gcc not found yet"

    - name: Set environment
      run: |
        echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "PSL1GHT=/usr/local/ps3dev" >> $GITHUB_ENV
        echo "PATH=/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:/usr/local/ps3dev/host/bin:$PATH" >> $GITHUB_ENV

    - name: Generate icons & backgrounds
      run: |
        python3 tools/gen_icons.py
        ls -la data/

    - name: Build BadCBA
      run: |
        set -e
        export PS3DEV=/usr/local/ps3dev
        export PSL1GHT=/usr/local/ps3dev
        export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PS3DEV/host/bin:$PATH

        echo "Compiler check:"
        which ppu-gcc || { echo "ERROR: ppu-gcc missing - toolchain not ready"; exit 1; }
        ppu-gcc --version | head -2

        make clean || true
        make -j$(nproc)
        make pkg

        ls -la *.pkg *.elf *.self 2>/dev/null || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BadCBA-${{ github.sha }}
        path: |
          BadCBA.pkg
          BadCBA.elf
          BadCBA.self
          data/ICON0.PNG
          data/PIC1.PNG
        if-no-files-found: warn

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: BadCBA.pkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
