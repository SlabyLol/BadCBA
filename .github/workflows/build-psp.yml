name: Build BadCBA PSP

on:
  push:
    branches: [ main ]
    paths:
      - 'psp/**'
      - '.github/workflows/build-psp.yml'
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'psp/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-psp:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Ensure python3 for icon
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends python3
        fi
        python3 --version

    - name: Build EBOOT.PBP
      working-directory: psp
      run: |
        set -e
        echo "PSPDEV=$PSPDEV"
        which psp-gcc
        psp-gcc --version | head -2
        python3 gen_icon0.py
        ls -la ICON0.PNG
        make clean || true
        make
        ls -la EBOOT.PBP PARAM.SFO ICON0.PNG BadCBA.prx 2>/dev/null || ls -la

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BadCBA-PSP-${{ github.sha }}
        path: |
          psp/EBOOT.PBP
          psp/PARAM.SFO
          psp/ICON0.PNG
          psp/BadCBA.prx
          psp/BadCBA.elf
        if-no-files-found: warn

    - name: Publish Release (PSP)
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && format('BadCBA {0}', github.ref_name) || 'BadCBA latest' }}
        files: |
          psp/EBOOT.PBP
          psp/ICON0.PNG
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
